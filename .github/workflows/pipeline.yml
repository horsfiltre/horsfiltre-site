# Pipeline unique : rien n'est publié si un contrôle échoue.
# Actions épinglées par empreinte de commit (supply chain) ; Dependabot les tient à jour.
name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Moindre privilège par défaut : lecture seule.
permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Détection de secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer gitleaks (version épinglée, empreinte vérifiée)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Analyser tout l'historique
        run: ./gitleaks git . --redact --verbose

  qualite:
    name: Validation HTML et performance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances (verrou strict, sans scripts)
        run: npm ci --ignore-scripts

      - name: Vérifier les signatures et la provenance des paquets npm
        run: npm audit signatures

      - name: Valider le HTML
        run: npm run lint:html

      - name: Vérifier performance, accessibilité, bonnes pratiques et SEO
        run: npm run lhci

      - name: Conserver le rapport Lighthouse
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-lighthouse
          path: .lighthouseci/
          retention-days: 14

  deploy:
    name: Déploiement
    needs: [secrets, qualite]
    # Pas de déploiement pour les contributions externes ni pour Dependabot :
    # ils n'ont pas accès aux secrets, et ne doivent pas en avoir.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Installer les dépendances (verrou strict, sans scripts)
        run: npm ci --ignore-scripts

      - name: Vérifier les signatures et la provenance des paquets npm
        run: npm audit signatures

      - name: Publier sur Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Le nom de branche passe par une variable d'environnement,
          # jamais interpolé directement dans le script (injection).
          BRANCHE: ${{ github.head_ref || github.ref_name }}
        run: |
          npx wrangler pages deploy public \
            --project-name=horsfiltre \
            --branch="$BRANCHE" | tee deploy.log
          url=$(grep -oE "https://[a-zA-Z0-9.-]+\.pages\.dev" deploy.log | tail -1)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then url="https://horsfiltre.fr"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
